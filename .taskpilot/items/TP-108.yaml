description: 'Add a user-facing toggle controlling visibility of the trailing ''Cancelled'' column on the board. Default state is off, so the column is hidden on first load. Toggle state should persist across sessions. Open questions to resolve during spec: where the toggle lives (board header vs. settings), whether persistence is per-user local state or a stored setting, and what happens to cancelled items when the column is hidden (still reachable via filter/search?).'
