description: Make the primary item ID in Board cards and the item-detail header a dedicated copy control. Activating the control copies only the canonical item ID to the clipboard and must not open, close, or navigate the item. Provide accessible success feedback and a retryable/error state when clipboard access fails. Cover pointer and keyboard activation, propagation from the Board card, and both contexts with component and functional UI coverage.
