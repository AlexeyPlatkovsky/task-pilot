description: 'Apply a default filter of Updated = ''Last 7 days'' to every board on load. Requires the Updated filter to exist as a first-class, user-clearable filter so the default is visible and overridable, not hidden behavior. Open questions for spec: whether the user''s last-used filter overrides the default on return visits, and how the default interacts with items that have never been updated since creation.'
