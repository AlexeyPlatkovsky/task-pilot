description: Replace the item-detail header title display with an editable input for writable active items. Save a changed valid title immediately on blur or when the detail card closes, then render the returned title. Do not send a mutation when unchanged. Keep the edited value visible and show a retryable error if persistence fails; do not silently discard it. Preserve existing server-side title validation, archived read-only behavior, and explicit Edit mode support for remaining fields. Cover validation, blur, close, pending/error/retry, and external-refresh interaction.
